name: Bug report
description: Report a reproducible failure in the pipeline or review platform.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach private images, model weights, credentials, or unredacted machine paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a redacted command, public fixture, and the smallest relevant log excerpt.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste redacted output from `yolo-label-recovery doctor --redact-paths` when relevant.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python pipeline
        - Desktop reviewer
        - Spring Boot API
        - Vue review workspace
        - Docker or LAN deployment
        - Documentation
    validations:
      required: true
